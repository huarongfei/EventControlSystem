name: EventControlSystem CI/CD

# ── Actions 版本策略说明 ──────────────────────────────
# 使用 major tag（如 @v4）而非 commit hash，原因：
# 1. GitHub 官方推荐方式 — 自动指向最新安全版本
# 2. 避免错过安全修复和 bug 修复（commit hash 需手动更新）
# 3. GitHub Actions 的 major tag 由官方维护，供应链风险可控
# 如需完全确定性构建，可切换到具体 commit hash
# ──────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".editorconfig"
      - ".env.example"
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '8.0.x'

jobs:
  # ════════════════════════════════
  # 1. Server — 类型检查 + 构建 + 测试
  # ════════════════════════════════
  server:
    name: Server — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx jest --ci --forceExit --detectOpenHandles --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./test.db"

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 7

  # ════════════════════════════════
  # 2. Windows 客户端构建
  # ════════════════════════════════
  windows-clients:
    name: Windows Clients — Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build ScoringSystem (Release)
        run: dotnet build windows/ScoringSystem/ScoringSystem.csproj --configuration Release --no-restore
        shell: pwsh

      - name: Build BroadcastControl (Release)
        run: dotnet build windows/BroadcastControl/BroadcastControl.csproj --configuration Release --no-restore
        shell: pwsh

  # ════════════════════════════════
  # 3. Docker 镜像构建 + 推送（仅 master）
  # ════════════════════════════════
  docker:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════
  # 4. 安全扫描 — CodeQL
  # ════════════════════════════════
  codeql:
    name: Security — CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [server]
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'csharp']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

# Nginx Fix Configuration for Missing Files
# Add this to your nginx configuration

# Fix for favicon.ico
location = /favicon.ico {
    # Option 1: Redirect to SVG
    # return 301 /favicon.svg;
    
    # Option 2: Serve a minimal 16x16 PNG
    alias /var/www/html/Myweb/favicon-16x16.png;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Fix for 404.html
error_page 404 /404.html;
location = /404.html {
    root /var/www/html/Myweb;
    internal;
}

# Fix for security.txt
location = /security.txt {
    alias /var/www/html/Myweb/security.txt;
}

location = /.well-known/security.txt {
    alias /var/www/html/Myweb/.well-known/security.txt;
}

# Block malicious requests
location ~* /(setup\.cgi|HNAP1|sdk|webui|geoserver|nmaplowercheck|evox) {
    deny all;
    return 403;
}

# Block common attack paths
location ~* \.(php|asp|aspx|jsp|cgi|pl|sh|exe|dll|bat|cmd|tmp|temp|ini|log)$ {
    deny all;
    return 404;
}

# Block hidden files
location ~ /\. {
    deny all;
}

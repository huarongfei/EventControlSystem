# Nginx Configuration for Huafeirong Website
# Optimized for security and performance

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Basic Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Cache Configuration
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Default Server Configuration
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Root directory
        root /var/www/html/Myweb;
        index index.html;

        # Security headers (redundant but safe)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Rate limiting
        limit_req zone=one burst=20 nodelay;
        limit_conn addr 50;

        # Block suspicious requests
        location ~* (\.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)|~|\.~) {
            deny all;
            return 404;
        }

        # Block common malicious paths
        location ~* (\.env|\.git|\.htaccess|\.htpasswd|\.DS_Store|\.idea|\.vscode|\.well-known/(?!security\.txt)) {
            deny all;
            return 404;
        }

        # Block scan attempts
        location ~* /(wp-admin|wp-login|admin|administrator|api|graphql|console|phpmyadmin|phpinfo|\.php|\.asp|\.aspx|\.jsp|\.cgi|\.pl|\.sh|\.exe|\.dll|\.bat|\.cmd|\.tmp|\.temp|\.ini|\.log) {
            deny all;
            return 404;
        }

        # Block common attack paths
        location ~* /(setup\.cgi|HNAP1|sdk|webui|geoserver|nmaplowercheck|evox) {
            deny all;
            return 403;
        }

        # Security.txt
        location = /security.txt {
            alias /var/www/html/Myweb/security.txt;
        }

        location = /.well-known/security.txt {
            alias /var/www/html/Myweb/.well-known/security.txt;
        }

        # Favicon
        location = /favicon.ico {
            alias /var/www/html/Myweb/favicon.ico;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /favicon.svg {
            alias /var/www/html/Myweb/favicon.svg;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Robots.txt and Sitemap
        location = /robots.txt {
            alias /var/www/html/Myweb/robots.txt;
        }

        location = /sitemap.xml {
            alias /var/www/html/Myweb/sitemap.xml;
        }

        # Main site files
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        # Blog directory
        location /blog/ {
            try_files $uri $uri.html =404;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 403 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            internal;
            alias /var/www/html/Myweb/404.html;
        }

        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }

    # HTTPS configuration (for future use)
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name huafeirong.com www.huafeirong.com;
    #     
    #     ssl_certificate /etc/letsencrypt/live/huafeirong.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/huafeirong.com/privkey.pem;

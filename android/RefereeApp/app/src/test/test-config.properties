# 测试配置

## 环境变量配置
# 在运行集成测试前，请确保后端服务已启动

# 测试服务器地址
TEST_BASE_URL=http://localhost:3001

# 是否使用 Mock 服务器 (true/false)
USE_MOCK_SERVER=true

# 日志级别
LOG_LEVEL=DEBUG

# 测试超时 (毫秒)
TEST_TIMEOUT=30000

## 集成测试说明

### 1. 单元测试 (不需要后端)
```bash
./gradlew test
```

### 2. 集成测试 (需要后端运行在 localhost:3001)
```bash
# 启动后端
cd ../../server
npm run dev

# 运行集成测试
./gradlew test --tests "com.eventcontrol.refereeapp.ApiIntegrationTest"
```

### 3. 覆盖所有测试
```bash
./gradlew test
./gradlew connectedAndroidTest
```

## MockWebServer
集成测试使用 MockWebServer 模拟后端响应，
默认启用，无需实际后端服务。

如需连接真实后端，请将 USE_MOCK_SERVER=false
